<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #234;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #ccc;
      text-align: center;
    }

    .card h2 {
      margin: 0;
      color: #2f5d62;
    }

    table {
      width: 100%;
      background: white;
      border-collapse: collapse;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #2f5d62;
      color: white;
    }

    button {
      background: #2f5d62;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Panel Administrador</h1>
  <p id="bienvenida"></p>

  <div class="cards">
    <div class="card">
      <h2 id="totalUsuarios">0</h2>
      <p>Usuarios</p>
    </div>

    <div class="card">
      <h2 id="totalCursos">0</h2>
      <p>Cursos</p>
    </div>

    <div class="card">
      <h2 id="totalTareas">0</h2>
      <p>Tareas</p>
    </div>

    <div class="card">
      <h2 id="totalEntregas">0</h2>
      <p>Entregas</p>
    </div>
  </div>
<h2>Estadísticas generales</h2>

<div class="cards">

  <div class="card">
    <h2 id="mejorCurso">-</h2>
    <p>Curso con mejor promedio</p>
  </div>

  <div class="card">
    <h2 id="cursoMasEntregas">-</h2>
    <p>Curso con más entregas</p>
  </div>

  <div class="card">
    <h2 id="rolMasActivo">-</h2>
    <p>Rol más activo</p>
  </div>

</div>
  
  <h2>Cursos registrados</h2>

  <table>
    <thead>
      <tr>
        <th>Curso</th>
        <th>Clave</th>
        <th>Carrera</th>
        <th>Profesor</th>
        <th>Semestre</th>
      </tr>
    </thead>
    <tbody id="tablaCursos"></tbody>
  </table>

  <br>
  <button onclick="cerrarSesion()">Cerrar sesión</button>

  <script>
    const usuario = JSON.parse(localStorage.getItem("usuario"));

    if (!usuario || usuario.rol !== "admin") {
      window.location.href = "/login.html";
    }

    document.getElementById("bienvenida").textContent =
      "Bienvenida, " + usuario.nombre;

    async function cargarDatos() {
      const usuarios = await fetch("/usuarios").then(res => res.json());
      const cursos = await fetch("/cursos").then(res => res.json());
      const tareas = await fetch("/tareas").then(res => res.json());
      const entregas = await fetch("/entregas").then(res => res.json());
      const promedioCursos = await fetch("/dashboard/promedio-cursos").then(res => res.json());
      const entregasCursos = await fetch("/dashboard/entregas-cursos").then(res => res.json());
      const actividadRoles = await fetch("/dashboard/actividad-roles").then(res => res.json());

      document.getElementById("totalUsuarios").textContent = usuarios.length;
      document.getElementById("totalCursos").textContent = cursos.length;
      document.getElementById("totalTareas").textContent = tareas.length;
      document.getElementById("totalEntregas").textContent = entregas.length;
      if (promedioCursos.length > 0) {
      document.getElementById("mejorCurso").textContent = promedioCursos[0]._id;
}

if (entregasCursos.length > 0) {
  document.getElementById("cursoMasEntregas").textContent = entregasCursos[0]._id;
}

if (actividadRoles.length > 0) {
  document.getElementById("rolMasActivo").textContent = actividadRoles[0]._id;
}

      const tabla = document.getElementById("tablaCursos");

      cursos.forEach(curso => {
        tabla.innerHTML += `
          <tr>
            <td>${curso.nombreCurso}</td>
            <td>${curso.clave}</td>
            <td>${curso.carrera}</td>
            <td>${curso.profesor}</td>
            <td>${curso.semestre}</td>
          </tr>
        `;
      });
    }

    function cerrarSesion() {
      localStorage.removeItem("usuario");
      window.location.href = "/login.html";
    }

    cargarDatos();
  </script>

</body>
</html>
