<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login | MiUniversidad</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #2f5d62, #8fc1b5);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      background: white;
      width: 380px;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
      color: #2f5d62;
    }

    p {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #2f5d62;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #244b50;
    }

    #mensaje {
      margin-top: 15px;
      color: red;
    }

    .roles {
      margin-top: 20px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h1>MI UNIVERSIDAD</h1>
    <p>UAGRO</p>

    <form id="loginForm">
      <input type="email" id="correo" placeholder="Correo institucional" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <button type="submit">Ingresar</button>
    </form>

    <p id="mensaje"></p>

    <div class="roles">
      Admin | Coordinador | Profesor | Estudiante
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const correo = document.getElementById("correo").value;
      const password = document.getElementById("password").value;

      const res = await fetch("/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ correo, password })
      });

      const data = await res.json();

      if (!res.ok) {
        document.getElementById("mensaje").textContent = data.mensaje;
        return;
      }

      localStorage.setItem("usuario", JSON.stringify(data.usuario));

      if (data.usuario.rol === "admin") {
        window.location.href = "/admin.html";
      } else if (data.usuario.rol === "coordinador") {
        window.location.href = "/coordinador.html";
      } else if (data.usuario.rol === "profesor") {
        window.location.href = "/profesor.html";
      } else if (data.usuario.rol === "estudiante") {
        window.location.href = "/estudiante.html";
      }
    });
  </script>

</body>
</html>
